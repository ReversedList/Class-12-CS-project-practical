<!doctype html>
<html lang="en">
  <head class="">
    <meta charset="UTF-8" />
    <title>Home</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500&family=Public+Sans&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto,
          sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: #d5d8de;
        color: black;
        font:
          16px/1.55 "Public Sans",
          system-ui,
          sans-serif;
      }
      h1 {
        text-align: center;
        color: black;
      }
      a {
        color: #6ea8fe;
      }
      .box {
        padding: 10px;
        background: white;
        border: 1px solid #000000;
        border-radius: 12px;
        width: 50%;
        margin: 0 auto;
      }
      .box2 {
        width: 50%;
        margin: 20px auto;
        padding: 10px;
        font-size: 1.1rem;
        line-height: 1.85;
        letter-spacing: 0.02em;
        color: #2b2024;
        background: #faf6f4;
        border-radius: 12px;
      }
      .p1 {
        color: black;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Financial Manager</h1>
      <p class="p1">
        This is a personal finance manager.This aims to do the basic duties a
        financial manager would provide.
      </p>
    </div>

    <div class="box2">
      <p>
        Log in to continue using Financial Manager. If you don't have an
        account, sign up!
      </p>
      <a href="http://127.0.0.1:5000/login">Login!</a>
    </div>
  </body>
</html>
